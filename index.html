const flow={浴室清潔:{q:'浴室主要想清潔什麼？',a:['水垢','皂垢','霉斑'],r:['確認材質後局部測試清潔劑。','依污垢選擇合適清潔用品。','完成後沖洗並保持通風。'],i:'浴室清潔劑、清潔刷、手套'},居家修繕:{q:'你需要處理哪種問題？',a:['鎖螺絲','黏貼固定','水龍頭漏水'],r:['先確認尺寸、材質與施工位置。','使用合適工具，避免高風險施工。','問題持續時請找專業人員。'],i:'螺絲起子、活動扳手、防水膠帶'},租屋清潔:{q:'最需要清潔哪個區域？',a:['廚房油污','地板','全屋'],r:['先清除雜物，從高處往低處清潔。','依材質使用中性用品。','清潔後保持通風。'],i:'去油清潔劑、拖把、海綿'},防災備品:{q:'目前最擔心哪種狀況？',a:['停電','停水','颱風'],r:['先盤點家中現有用品。','優先準備照明、飲水與基礎防護。','依官方公告行動。'],i:'手電筒、乾電池、防災包'}};let current='';function openView(id){gate.className='hide';topnav.hidden=false;document.getElementById('voiceDock').hidden=id!=='map';document.getElementById('voiceStatus').hidden=id!=='map';document.querySelectorAll('.view').forEach(x=>x.hidden=x.id!==id);document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.view===id));window.scrollTo({top:0,behavior:'smooth'})}function choose(n){current=n;ans.innerHTML='';q.textContent='② '+flow[n].q;flow[n].a.forEach(a=>{let b=document.createElement('button');b.className='choice';b.textContent=a;b.onclick=()=>result(a);ans.append(b)});s2.className='step show';s2.scrollIntoView({behavior:'smooth'})}function getRecommendations(topic,answer){const tags={浴室清潔:['浴室','浴室除霉'],居家修繕:['居家修繕','家具組裝'],租屋清潔:['租屋清潔','大掃除'],防災備品:['停電應急','防颱與緊急備用品','照明與電力設備']}[topic]||[];const rank={必要:0,搭配:1,延伸:2};return p.filter(x=>tags.some(t=>x[5].includes(t)||x[6].includes(t))||x[6].includes(answer)).sort((a,b)=>(rank[a[7]]??9)-(rank[b[7]]??9)).slice(0,8)}function result(a){let f=flow[current],recommended=getRecommendations(current,a);rt.textContent=current+'｜'+a;rb.innerHTML='<ol>'+f.r.map(x=>'<li>'+x+'</li>').join('')+'</ol><h4>推薦商品名單</h4><ul class="recommend-products">'+(recommended.length?recommended.map(x=>'<li>'+x[0]+'（'+x[8]+'｜'+x[2]+'）</li>').join(''):f.i.split('、').map(x=>'<li>'+x+'</li>').join(''))+'</ul>';s3.className='step show';s3.scrollIntoView({behavior:'smooth'})}Object.keys(flow).forEach(n=>{let b=document.createElement('button');b.className='choice';b.textContent=n;b.onclick=()=>choose(n);sc.append(b)});const zn=['食品飲料','個人清潔','美髮美妝','居家清潔','文具用品','廚房用品','餐具容器','烹飪鍋具','茶具保溫','衛浴設備','收納晾曬','家具家飾','地墊用品','五金修繕','電器家電','女性衛生','服飾內著','鞋類用品','汽車用品','宗教寵物','玩具用品'],p=PRODUCTS_30K;zn.forEach((n,i)=>{let b=document.createElement('button');b.className='zone';b.dataset.zone=i+1;b.textContent=(i+1)+'區 '+n;b.onclick=()=>zone(i+1);(i<11?frontZones:backZones).append(b)});function highlightZone(n){document.querySelectorAll('.zone').forEach(b=>b.classList.toggle('active',Number(b.dataset.zone)===Number(n)))}function zone(n){highlightZone(n);let x=p.filter(a=>a[1]==n);detail.innerHTML='<button class="backbtn" onclick="resetDetail()">← 返回地圖</button><h2>'+n+'區｜'+zn[n-1]+'</h2>'+(x.length?x.map(a=>'<div class="product" onclick="prod(\''+a[0]+'\')">'+a[0]+'（點選層架）</div>').join(''):'<p>此區暫無模擬商品。</p>')}function resetDetail(){detail.innerHTML='<h2>商品資訊</h2><p>請選擇區域或搜尋商品。</p>'}function findProduct(){let q=search.value.trim();if(!q){resetDetail();return}let alias=HARDWARE_ALIASES.find(a=>a[0].includes(q)||q.includes(a[0])),terms=[q].concat(alias?[alias[2]]:[]),x=p.find(a=>terms.some(t=>[a[0],a[3],a[4],a[5],a[6],a[8]].some(v=>String(v).includes(t))));if(x){prod(x[0]);if(alias)detail.innerHTML='<p class="alias-hit">俗稱「'+alias[0]+'」對應：'+alias[2]+'</p>'+detail.innerHTML}else{highlightZone(0);detail.innerHTML='<h2>找不到商品</h2><p>請改用商品名稱、商品 ID、分類、生活情境、關鍵字或五金俗稱搜尋。</p>'}}function shelfLevel(v){let n=String(v).match(/第(\d+)層/);if(n)return Math.min(5,Math.max(1,Number(n[1])));return ({上層:1,中層:3,下層:5}[v]||3)}function shelfDepth(v){let text=String(v||'');return text.includes('前')?'前':text.includes('後')?'後':'中'}function shelfBay(title,name,position,show){let depth=shelfDepth(position);return '<div class="shelf-bay"><div class="shelf-bay-title">'+title+'</div><div class="shelf-depths">'+['前','中','後'].map(d=>'<div class="shelf-depth"><div class="shelf-depth-title">'+d+'</div><div class="row">'+(show&&depth===d?'<span class="mark" title="'+name+'" aria-label="'+name+'">📦</span>':'')+'</div></div>').join('')+'</div></div>'}function prod(n){let x=p.find(a=>a[0]==n);if(!x)return;highlightZone(x[1]);detail.innerHTML='<button class="backbtn" onclick="zone('+x[1]+')">← 返回'+x[1]+'區商品</button><h2>'+x[0]+'</h2><p>商品ID：'+x[3]+'</p><p>位置：'+x[1]+'區｜'+x[8]+'｜'+x[9]+'｜'+x[10]+'｜'+x[2]+'</p><p>售價：NT$'+x[11]+'｜庫存：'+x[12]+'</p><div class="shelf"><b>層架模擬圖</b><div class="shelf-frame">'+shelfBay('左側層架',x[0],x[9],String(x[9]).startsWith('左'))+'<div class="shelf-aisle">中間走道</div>'+shelfBay('右側層架',x[0],x[9],String(x[9]).startsWith('右'))+'</div></div>'}

<script src="voice-config.js"></script><script>
(function(){
  const button=document.getElementById('voiceInput');
  const speakButton=document.getElementById('voiceSpeak');
  const dock=document.getElementById('voiceDock');
  const status=document.getElementById('voiceStatus');
  const micMeter=document.getElementById('micMeter');
  const micLevelValue=document.getElementById('micLevelValue');
  const micBars=Array.from(document.querySelectorAll('#micWave i'));
  const search=document.getElementById('search');
  const voiceApiBase=String(window.XIAOBEI_VOICE_API_URL||'').replace(/\/+$/,'');
  let recorder=null,stream=null,chunks=[],lastReply='',lastLanguage='zh',currentUtterance=null,taigiVoiceFallback=false;
  let audioContext=null,micAnalyser=null,micSource=null,micSamples=null,micFrame=0;
  function updateMicMeter(){
    if(!micAnalyser||!recorder||recorder.state!=='recording')return;
    micAnalyser.getByteTimeDomainData(micSamples);
    let sum=0;
    for(let i=0;i<micSamples.length;i++){const sample=(micSamples[i]-128)/128;sum+=sample*sample;}
    const rms=Math.sqrt(sum/micSamples.length);
    const level=Math.max(0,Math.min(100,Math.round((rms-0.006)*850)));
    micLevelValue.textContent=level+'%';
    micBars.forEach(function(bar,index){
      const sampleIndex=Math.min(micSamples.length-1,Math.floor((index+1)*micSamples.length/(micBars.length+1)));
      const amplitude=Math.abs(micSamples[sampleIndex]-128)/128;
      bar.style.height=Math.max(2,Math.min(22,2+amplitude*75))+'px';
    });
    micFrame=requestAnimationFrame(updateMicMeter);
  }
  function startMicMeter(mediaStream){
    const AudioContextClass=window.AudioContext||window.webkitAudioContext;
    if(!AudioContextClass)return;
    try{
      audioContext=new AudioContextClass();
      micAnalyser=audioContext.createAnalyser();
      micAnalyser.fftSize=512;
      micSamples=new Uint8Array(micAnalyser.fftSize);
      micSource=audioContext.createMediaStreamSource(mediaStream);
      micSource.connect(micAnalyser);
      if(audioContext.state==='suspended')audioContext.resume().catch(function(){});
      micMeter.classList.add('active');
      micFrame=requestAnimationFrame(updateMicMeter);
    }catch(error){stopMicMeter();}
  }
  function stopMicMeter(){
    if(micFrame)cancelAnimationFrame(micFrame);
    micFrame=0;micMeter.classList.remove('active');micLevelValue.textContent='--%';
    micBars.forEach(function(bar){bar.style.height='2px';});
    if(micSource){micSource.disconnect();micSource=null;}
    micAnalyser=null;micSamples=null;
    if(audioContext){audioContext.close().catch(function(){});audioContext=null;}
  }
  function buildReply(query){
    const detail=document.getElementById('detail');
    const heading=detail.querySelector('h2');
    if(!heading||heading.textContent==='商品資訊')return '收到搜尋內容：'+query+'。請查看畫面上的商品結果。';
    if(heading.textContent==='找不到商品')return '目前找不到「'+query+'」，請換個商品名稱或俗稱再試一次。';
    const position=Array.from(detail.querySelectorAll('p')).map(function(p){return p.textContent.trim();}).find(function(text){return text.startsWith('位置：');});
    const price=Array.from(detail.querySelectorAll('p')).map(function(p){return p.textContent.trim();}).find(function(text){return text.startsWith('售價：');});
    return '找到'+heading.textContent+'。'+(position?position.replace(/^位置：/,'')+'。':'')+(price?price+'。':'');
  }
  function speakReply(text,detectedLanguage){
    if(!text||!window.speechSynthesis||!window.SpeechSynthesisUtterance){status.textContent='這個瀏覽器沒有可用的語音輸出功能。';return;}
    window.speechSynthesis.cancel();
    const lang=detectedLanguage==='nan'?'nan-CN':'zh-TW';
    const voices=window.speechSynthesis.getVoices();
    let voice=voices.find(function(v){return detectedLanguage==='nan'?/^nan[-_]/i.test(v.lang):/^zh[-_]tw/i.test(v.lang);});
    taigiVoiceFallback=detectedLanguage==='nan'&&!voice;
    if(taigiVoiceFallback)voice=voices.find(function(v){return /^zh[-_]tw/i.test(v.lang);})||null;
    const utterance=new SpeechSynthesisUtterance(text);
    utterance.lang=voice?voice.lang:lang;
    if(voice)utterance.voice=voice;
    utterance.rate=0.96;
    currentUtterance=utterance;
    utterance.onstart=function(){dock.classList.add('speaking');speakButton.textContent='■';speakButton.title='停止語音';status.textContent=taigiVoiceFallback?'此裝置沒有台語語音，暫以台灣國語播報。':'正在語音播報…';};
    utterance.onend=function(){dock.classList.remove('speaking');speakButton.textContent='🔊';speakButton.title='重播搜尋結果';currentUtterance=null;};
    utterance.onerror=function(){dock.classList.remove('speaking');speakButton.textContent='🔊';speakButton.title='重播搜尋結果';currentUtterance=null;status.textContent='語音播放失敗，請再按喇叭重播。';};
    window.speechSynthesis.speak(utterance);
  }
  speakButton.addEventListener('click',function(){if(window.speechSynthesis&&window.speechSynthesis.speaking){window.speechSynthesis.cancel();dock.classList.remove('speaking');speakButton.textContent='🔊';speakButton.title='重播搜尋結果';currentUtterance=null;}else if(lastReply)speakReply(lastReply,lastLanguage);});
  function finishWithTranscript(text,detectedLanguage){
    const transcript=String(text||'').trim();
    if(!transcript){status.textContent='沒有辨識到文字，請再說一次。';return;}
    if(document.getElementById('map').hidden)openView('map');
    search.value=transcript;
    findProduct();
    const names={zh:'國語',nan:'台語',hak:'客語',en:'英語'};const detected=names[detectedLanguage]||'自動辨識';
    lastReply=buildReply(transcript);lastLanguage=detectedLanguage||'zh';speakButton.disabled=!lastReply;
    status.textContent='已辨識'+detected+'並搜尋：「'+transcript+'」';
    speakReply(lastReply,lastLanguage);
  }
  async function startRecording(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){status.textContent='此瀏覽器沒有可用的錄音功能。請用 Safari 或 Chrome 開啟 http://127.0.0.1:8000/，不要用 file:// 開啟。';return;}
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:true});
      chunks=[];recorder=new MediaRecorder(stream);
      recorder.addEventListener('dataavailable',function(event){if(event.data&&event.data.size)chunks.push(event.data);});
      recorder.addEventListener('stop',async function(){
        stopMicMeter();
        const mime=recorder.mimeType||'audio/webm';
        const extension=mime.indexOf('mp4')>=0?'m4a':'webm';
        const form=new FormData();
        form.append('audio',new Blob(chunks,{type:mime}),'voice.'+extension);
        form.append('language','auto');
        button.disabled=true;button.classList.remove('recording');button.textContent='🎙';
        status.textContent='錄音完成，正在辨識…';
        try{
          if(!voiceApiBase){status.textContent='地圖已上線；語音辨識 API 尚未連接。';return;}
          const response=await fetch(voiceApiBase+'/api/voice/transcribe',{method:'POST',body:form});
          const data=await response.json();
          if(!response.ok)throw new Error(data.detail||'transcription failed');
          finishWithTranscript(data.transcript,data.detected_language);
        }catch(error){status.textContent='語音辨識失敗：'+(error.message||'請確認本機語音服務正在執行。');}
        finally{button.disabled=false;if(stream){stream.getTracks().forEach(function(track){track.stop();});stream=null;}}
      },{once:true});
      recorder.start();startMicMeter(stream);button.classList.add('recording');button.textContent='■';button.title='停止錄音並輸入';
      status.textContent='正在錄音…說完後再按一次停止。';
    }catch(error){const name=error&&error.name||'UnknownError';if(name==='NotAllowedError'||name==='PermissionDeniedError'){status.textContent='麥克風權限被瀏覽器或 macOS 封鎖。請允許此網站使用麥克風後重新整理。';}else if(name==='NotFoundError'||name==='DevicesNotFoundError'){status.textContent='找不到麥克風。請接上或選取可用的輸入裝置。';}else if(name==='NotReadableError'||name==='TrackStartError'){status.textContent='麥克風目前被其他程式占用。請關閉正在使用麥克風的程式後重試。';}else if(name==='SecurityError'){status.textContent='瀏覽器限制了麥克風。請用 http://127.0.0.1:8000/ 開啟，不要使用 file://。';}else{status.textContent='麥克風錯誤：'+name+(error&&error.message?'｜'+error.message:'');}}
  }
  button.addEventListener('click',function(){
    if(recorder&&recorder.state==='recording'){recorder.stop();status.textContent='正在送出錄音…';return;}
    startRecording();
  });
})();
</script>
