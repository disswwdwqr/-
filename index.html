pan>':'')+'</div></div>').join('')+'</div></div>'}function prod(n){let x=p.find(a=>a[0]==n);if(!x)return;highlightZone(x[1]);detail.innerHTML='<button class="backbtn" onclick="zone('+x[1]+')">← 返回'+x[1]+'區商品</button><h2>'+x[0]+'</h2><p>商品ID：'+x[3]+'</p><div class="product-card__wayfinding product-detail__wayfinding"><p class="product-card__aisle"><span>走道</span><strong>'+x[1]+'區 · '+x[8]+'</strong></p><div class="product-card__placement"><span>放置位置</span><div><strong>'+x[9]+' · '+x[2]+'</strong><code>'+x[10]+'</code></div></div></div><p>售價：NT$'+x[11]+'｜庫存：'+x[12]+'</p><div class="shelf"><b>層架模擬圖</b><div class="shelf-frame">'+shelfBay('左側層架',x[0],x[9],String(x[9]).startsWith('左'))+'<div class="shelf-aisle">中間走道</div>'+shelfBay('右側層架',x[0],x[9],String(x[9]).startsWith('右'))+'</div></div>'}

(function(){
  const button=document.getElementById('voiceInput');
  const dock=document.getElementById('voiceDock');

  const micMeter=document.getElementById('micMeter');
  const micLevelValue=document.getElementById('micLevelValue');
  const micBars=Array.from(document.querySelectorAll('#micWave i'));
  const search=document.getElementById('search');
  const detail=document.getElementById('detail');
  const voiceApiBase=String(window.XIAOBEI_VOICE_API_URL||'').replace(/\/+$/,'');
  let recorder=null,stream=null,chunks=[];
  let audioContext=null,micAnalyser=null,micSource=null,micSamples=null,micFrame=0;

  function updateMicMeter(){
    if(!micAnalyser||!recorder||recorder.state!=='recording')return;
    micAnalyser.getByteTimeDomainData(micSamples);
    let sum=0;
    for(let i=0;i<micSamples.length;i++){const sample=(micSamples[i]-128)/128;sum+=sample*sample;}
    const rms=Math.sqrt(sum/micSamples.length);
    const level=Math.max(0,Math.min(100,Math.round((rms-0.006)*850)));
    micLevelValue.textContent=level+'%';
    micBars.forEach(function(bar,index){
      const sampleIndex=Math.min(micSamples.length-1,Math.floor((index+1)*micSamples.length/(micBars.length+1)));
      const amplitude=Math.abs(micSamples[sampleIndex]-128)/128;
      bar.style.height=Math.max(2,Math.min(22,2+amplitude*75))+'px';
    });
    micFrame=requestAnimationFrame(updateMicMeter);
  }
  function startMicMeter(mediaStream){
    const AudioContextClass=window.AudioContext||window.webkitAudioContext;
    if(!AudioContextClass)return;
    try{
      audioContext=new AudioContextClass();micAnalyser=audioContext.createAnalyser();micAnalyser.fftSize=512;
      micSamples=new Uint8Array(micAnalyser.fftSize);micSource=audioContext.createMediaStreamSource(mediaStream);micSource.connect(micAnalyser);
      if(audioContext.state==='suspended')audioContext.resume().catch(function(){});
      micMeter.classList.add('active');micFrame=requestAnimationFrame(updateMicMeter);
    }catch(error){stopMicMeter();}
  }
  function stopMicMeter(){
    if(micFrame)cancelAnimationFrame(micFrame);micFrame=0;micMeter.classList.remove('active');micLevelValue.textContent='--%';
    micBars.forEach(function(bar){bar.style.height='2px';});

    if(audioContext){audioContext.close().catch(function(){});audioContext=null;}
  }
  function normalizeVoiceQuery(value){

    const remove=['請問有賣','我想要找','我想要買','我想找','我想買','我要找','我要買','我欲揣','我要揣','幫我找','幫我查','幫我搜尋','查一下','麻煩找','不好意思','請問','想請問','我想知道','有沒有','哪裡有','哪裡買','放在哪裡','放哪裡','放在什麼地方','在哪一個區','在哪個區','在哪一區','在哪裡','在哪邊','在哪區','在幾區','是哪一區','哪一個位置','哪個位置','哪一區','哪個區','什麼區','第幾區','佇佗位','佇哪位','佇哪一區','佇哪區','底佗位','咧佗位','放佗位','佇佗','佗位','幾區','哪邊','哪裡','我欲','欲揣','要找','找一下','位置','區域','在哪','有嗎','嗎','呢','啊','的'];
    remove.sort(function(a,b){return b.length-a.length;});
    remove.forEach(function(part){query=query.split(part).join('');});
    return query;
  }
  function voiceMatches(transcript){
    const raw=String(transcript||'').toLocaleLowerCase().replace(/[，。？！?、,.！：；「」『』\s]/g,'');
    const aliases=HARDWARE_ALIASES.filter(function(a){return raw.includes(String(a[0]).toLocaleLowerCase());});
    const fields=function(product){return [product[0],product[3],product[4],product[6]].map(function(v){return String(v||'').toLocaleLowerCase();});};
    const addMatchingProducts=function(term,into){
      const key=String(term||'').toLocaleLowerCase();if(key.length<2)return;
      p.forEach(function(product){if(fields(product).some(function(field){return field.includes(key);}))into.add(product);});
    };
    const aliasHits=new Set();
    aliases.forEach(function(alias){addMatchingProducts(alias[2],aliasHits);});
    if(aliasHits.size)return Array.from(aliasHits);

    const recognizedTerms=new Set();
    p.forEach(function(product){
      const candidates=[product[0],product[3],product[4]].concat(String(product[6]||'').split(/[、,，]/));
      candidates.forEach(function(value){const term=String(value||'').trim();if(term.length>=2&&raw.includes(term.toLocaleLowerCase()))recognizedTerms.add(term);});
    });
    const directHits=new Set();
    recognizedTerms.forEach(function(term){addMatchingProducts(term,directHits);});
    if(directHits.size)return Array.from(directHits);

    const query=normalizeVoiceQuery(transcript);
    const queryHits=new Set();addMatchingProducts(query,queryHits);
    return Array.from(queryHits);
  }
  function renderVoiceResults(transcript){
    const matches=voiceMatches(transcript);
    const areas=Array.from(new Set(matches.map(function(product){return Number(product[1]);}))).filter(function(n){return n>=1&&n<=zn.length;}).sort(function(a,b){return a-b;});
    document.querySelectorAll('.zone').forEach(function(zoneButton){zoneButton.classList.toggle('active',areas.includes(Number(zoneButton.dataset.zone)));});
    detail.replaceChildren();
    const heading=document.createElement('h2');heading.textContent=matches.length?'商品所在區域':'找不到商品';detail.appendChild(heading);
    const spoken=document.createElement('p');spoken.textContent='辨識內容：'+transcript;detail.appendChild(spoken);
    if(!areas.length){const help=document.createElement('p');help.textContent='請試著只說商品名稱，或改用商品地圖上的文字搜尋。';detail.appendChild(help);return;}
    const intro=document.createElement('p');intro.textContent='商品可能在以下區域：';detail.appendChild(intro);
    const list=document.createElement('ul');
    areas.forEach(function(area){const item=document.createElement('li');item.textContent=area+'區｜'+zn[area-1];list.appendChild(item);});
    detail.appendChild(list);
  }
  async function updateVoiceHealth(){
    if(!voiceApiBase){button.disabled=true;status.textContent='本機語音請由 start_local_voice.command 啟動後使用。';return;}
    try{
      const response=await fetch(voiceApiBase+'/api/voice/health',{cache:'no-store'});
      const data=await response.json();
      if(data.model_loaded){button.disabled=false;status.textContent='本機國語／台語辨識已就緒。';}
      else{button.disabled=true;status.textContent=data.detail?'模型載入失敗，請查看本機服務視窗。':'本機語音模型載入中，稍候會自動就緒…';window.setTimeout(updateVoiceHealth,5000);}
    }catch(error){button.disabled=true;status.textContent='本機語音服務尚未啟動，請雙擊 start_local_voice.command。';}
  }
  function finishWithTranscript(text,detectedLanguage){
    const transcript=String(text||'').trim();
    if(!transcript){status.textContent='沒有辨識到文字，請再說一次。';return;}
    if(document.getElementById('map').hidden)openView('map');
    search.value=transcript;renderVoiceResults(transcript);
    const names={zh:'國語',nan:'台語',hak:'客語',en:'英語'};const detected=names[detectedLanguage]||'自動辨識';
    status.textContent='已辨識'+detected+'：「'+transcript+'」';
  }
  async function startRecording(){
    if(!voiceApiBase){status.textContent='本機語音請由 start_local_voice.command 啟動後使用。';return;}
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){status.textContent='此瀏覽器沒有可用的錄音功能。請用 Safari 或 Chrome 開啟本機網站。';return;}
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);
      recorder.addEventListener('dataavailable',function(event){if(event.data&&event.data.size)chunks.push(event.data);});
      recorder.addEventListener('stop',async function(){
        stopMicMeter();const mime=recorder.mimeType||'audio/webm';const extension=mime.indexOf('mp4')>=0?'m4a':'webm';
        const form=new FormData();form.append('audio',new Blob(chunks,{type:mime}),'voice.'+extension);form.append('language','auto');
        button.disabled=true;button.classList.remove('recording');button.textContent='🎙';status.textContent='正在本機辨識…';
        try{
          const response=await fetch(voiceApiBase+'/api/voice/transcribe',{method:'POST',body:form});const data=await response.json();
          if(!response.ok)throw new Error(data.detail||'語音辨識失敗');finishWithTranscript(data.transcript,data.detected_language);
        }catch(error){status.textContent=error.message||'本機語音辨識失敗，請再試一次。';}
        finally{if(stream){stream.getTracks().forEach(function(track){track.stop();});stream=null;}button.disabled=false;}
      },{once:true});
      recorder.start();startMicMeter(stream);button.classList.add('recording');button.textContent='■';button.title='停止錄音並搜尋';status.textContent='正在錄音…說完後再按一次停止。';
    }catch(error){const name=error&&error.name||'UnknownError';if(name==='NotAllowedError'||name==='PermissionDeniedError'){status.textContent='麥克風權限被瀏覽器封鎖。請允許此網站使用麥克風後重新整理。';}else if(name==='NotFoundError'||name==='DevicesNotFoundError'){status.textContent='找不到麥克風，請接上或選取可用的輸入裝置。';}else if(name==='NotReadableError'||name==='TrackStartError'){status.textContent='麥克風目前被其他程式占用，請關閉後重試。';}else{status.textContent='麥克風錯誤：'+name+(error&&error.message?'｜'+error.message:'');}}
  }
  button.addEventListener('click',function(){if(recorder&&recorder.state==='recording'){recorder.stop();status.textContent='正在送出錄音至本機…';return;}startRecording();});
  updateVoiceHealth();
})();
</script>
